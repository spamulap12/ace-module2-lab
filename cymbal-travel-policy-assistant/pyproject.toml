[project]
name = "cymbal-travel-policy-agent"
version = "1.0.0"
description = "Cymbal Group Travel Policy Concierge AI Agent"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "google-genai>=2.0.0",
    "google-adk>=2.9.0",
    "pypdf>=4.0.0",
    "mcp>=1.0.0",
    "pyyaml>=6.0",
    "httpx>=0.27.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
